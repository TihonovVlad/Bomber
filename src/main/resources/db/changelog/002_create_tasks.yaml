databaseChangeLog:
  - changeSet:
      id: 002-1
      author: TihonovVlad
      changes:
        - createTable:
            tableName: tasks
            remarks: "Таблица задач"
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: phone_number
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: "NEW"
                  constraints:
                    nullable: false
              - column:
                  name: providers_used
                  type: JSONB
                  defaultValueComputed: "'{}'::jsonb"
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-2
      author: TihonovVlad
      changes:
        - addForeignKeyConstraint:
            baseTableName: tasks
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_tasks_user_id
            onDelete: CASCADE
            onUpdate: CASCADE

  - changeSet:
      id: 002-3
      author: TihonovVlad
      changes:
        - createIndex:
            indexName: idx_tasks_user_id
            tableName: tasks
            columns:
              - column:
                  name: user_id